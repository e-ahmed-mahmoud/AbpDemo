
@if (categories().length > 0) {

    <ngx-datatable class="material" [rows]="categories()  || []" [count]="pagedList().maxResultCount || 0" [columnMode]="'force'" [headerHeight]="50"
    [footerHeight]="50" [rowHeight]="50" [limit]="5"
    >
    <ngx-datatable-column name="NameAr" prop="nameAr"></ngx-datatable-column>
    <ngx-datatable-column name="NameEn" prop="nameEn"></ngx-datatable-column>
    </ngx-datatable>

}
@else {
    <div> No categories avaliable  </div>
}
